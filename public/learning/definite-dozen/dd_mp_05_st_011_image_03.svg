    <rect x="500" y="280" width="24" height="24" rx="3" fill="#730300"/>
    <text x="540" y="300">Facial expression / nonverbal — 55%</text>
  </g>
  <text x="450" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#555555">Albert Mehrabian, Silent Messages (1981)</text>
